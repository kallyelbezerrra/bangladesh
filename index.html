<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Bangladesh — Placar</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="bangladesh-styles.css"></head><body><div class="flag-orb"></div><main class="app-shell"><header class="hero"><div class="brand"><span class="brand-mark"></span><div><p class="eyebrow">Escola Sabatina</p><h1>Bangladesh</h1></div></div><p class="hero-copy">Cada atitude conta. Marque as ações, some os pontos e celebre a turma.</p></header><section class="scoreboard"><div class="section-heading"><div><p class="eyebrow">Ranking da semana</p><h2>Placar</h2></div><button class="button button-primary" id="add-member">+ Adicionar pessoa</button></div><div id="members" class="member-list"></div><div id="empty-members" class="empty-state" hidden><span>✦</span><p>Comece adicionando alguém ao placar.</p></div></section><section class="actions-panel"><div class="section-heading"><div><p class="eyebrow">Como pontuar</p><h2>Ações</h2></div><button class="button button-outline" id="add-action">+ Nova ação</button></div><div id="actions" class="actions-list"></div><p id="empty-actions" class="empty-actions" hidden>Adicione uma ação para começar a marcar pontos.</p></section></main><template id="member-template"><article class="member-card"><div class="member-topline"><span class="position"></span><label class="name-label"><span class="sr-only">Nome</span><input class="member-name" maxlength="40" placeholder="Nome da pessoa"></label><strong class="member-score">0 <small>pts</small></strong><button class="icon-button delete-member" aria-label="Remover pessoa">×</button></div><div class="member-actions"></div></article></template><template id="action-template"><div class="action-editor"><input class="action-name" maxlength="45" placeholder="Ex.: Trouxe a Bíblia" aria-label="Nome da ação"><label class="points-field"><span>vale</span><input class="action-points" type="number" min="0" max="999" aria-label="Pontos da ação"><span>pts</span></label><button class="icon-button delete-action" aria-label="Remover ação">×</button></div></template><script src="bangladesh-app.js"></script></body></html>
